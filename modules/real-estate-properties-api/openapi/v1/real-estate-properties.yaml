openapi: 3.1.0
info:
  title: Real Estate Properties API
  version: 1.0.0
security: [{sanctum: []}]
x-liberu-idempotency-header: Idempotency-Key
paths:
  /api/v1/public/properties:
    get:
      operationId: public.properties.index
      security: []
      parameters:
        - {name: territory, in: query, description: "Legacy territory code or city slug.", schema: {type: string, maxLength: 20}}
        - {name: bbox, in: query, description: "Viewport bounds as minLongitude,minLatitude,maxLongitude,maxLatitude; supports crossing the date line.", schema: {type: string}}
        - {name: deal_type, in: query, schema: {type: string, enum: [sale, rent, daily]}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 60}}
      responses: {'200': {description: Paginated public properties}, '422': {description: Invalid filters}}
  /api/v1/real-estate/community-events:
    get:
      operationId: real.estate.properties.communityEvents
      security: [{sanctum: []}]
      parameters:
        - {name: category, in: query, schema: {type: string, maxLength: 80}}
        - {name: property_id, in: query, schema: {type: integer}}
        - {name: latitude, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: longitude, in: query, schema: {type: number, minimum: -180, maximum: 180}}
        - {name: radius, in: query, schema: {type: number, exclusiveMinimum: 0, maximum: 500}}
      responses: {'200': {description: Paginated upcoming public community events}}
  /api/v1/real-estate/community-events/{event}:
    get:
      operationId: real.estate.properties.communityEvent
      security: [{sanctum: []}]
      parameters: [{name: event, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: Community event}, '403': {description: Private event}, '404': {description: Event not found}}
  /api/v1/real-estate/property-saved-searches:
    get: {operationId: real.estate.properties.savedSearches, security: [{sanctum: []}], responses: {'200': {description: Paginated saved searches}}}
    post:
      operationId: real.estate.properties.saveSearch
      security: [{sanctum: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, criteria], properties: {name: {type: string, maxLength: 120}, criteria: {type: object, additionalProperties: true}}}}}}
      responses: {'201': {description: Saved search created}, '422': {description: Validation error}}
  /api/v1/real-estate/property-saved-searches/{savedSearch}:
    delete: {operationId: real.estate.properties.deleteSavedSearch, security: [{sanctum: []}], responses: {'200': {description: Saved search deleted}}}
  /api/v1/real-estate/properties/{property}/price-alerts:
    get:
      operationId: real.estate.properties.priceAlerts
      security: [{sanctum: []}]
      parameters: [{name: property, in: path, required: true, schema: {type: integer, minimum: 1}}]
      responses: {'200': {description: Paginated property price alerts}}
    post:
      operationId: real.estate.properties.createPriceAlert
      security: [{sanctum: []}]
      parameters: [{name: property, in: path, required: true, schema: {type: integer, minimum: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PriceAlertInput'}}}}
      responses: {'201': {description: Price alert created}, '422': {description: Validation error}}
  /api/v1/real-estate/price-alerts/{alert}:
    patch:
      operationId: real.estate.properties.updatePriceAlert
      security: [{sanctum: []}]
      parameters: [{name: alert, in: path, required: true, schema: {type: integer, minimum: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PriceAlertInput'}}}}
      responses: {'200': {description: Price alert updated}, '422': {description: Validation error}}
    delete:
      operationId: real.estate.properties.deletePriceAlert
      security: [{sanctum: []}]
      parameters: [{name: alert, in: path, required: true, schema: {type: integer, minimum: 1}}]
      responses: {'200': {description: Price alert deleted}}
  /api/v1/real-estate/properties:
    get:
      operationId: real.estate.properties.list
      security: [{sanctum: []}]
      parameters:
        - {name: latitude, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: longitude, in: query, schema: {type: number, minimum: -180, maximum: 180}}
        - {name: radius, in: query, schema: {type: number, exclusiveMinimum: 0, maximum: 500, description: Radius in kilometres}}
        - {name: status, in: query, schema: {type: string, enum: [draft, available, under_offer, sold, let, withdrawn]}}
        - {name: property_template_id, in: query, schema: {type: integer, minimum: 1, nullable: true}}
        - {name: sort_by, in: query, schema: {type: string, enum: [created_at, updated_at, price, year_built, bedrooms, bathrooms, area_sqft, address]}}
        - {name: sort_direction, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: amenities[], in: query, style: form, explode: true, schema: {type: array, maxItems: 20, items: {type: string, maxLength: 80}}}
      responses:
        '200': {description: Authorized paginated properties, content: {application/json: {schema: {$ref: '#/components/schemas/PropertyPage'}}}}
    post:
      operationId: real.estate.properties.create
      security: [{sanctum: []}]
      responses:
        '201': {description: Property created}
  /api/v1/real-estate/properties/compare:
    get:
      operationId: real.estate.properties.compare
      security: [{sanctum: []}]
      parameters:
        - {name: property_ids[], in: query, required: true, style: form, explode: true, schema: {type: array, minItems: 2, maxItems: 4, uniqueItems: true, items: {type: integer, minimum: 1}}}
      responses:
        '200': {description: Authorized properties in requested comparison order}
  /api/v1/real-estate/properties/tax-estimate:
    post:
      operationId: real.estate.properties.taxEstimate
      security: [{sanctum: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchase_price]
              properties:
                purchase_price: {type: number, minimum: 0}
                country: {type: string, default: UK}
                buyer_type: {type: string, enum: [first_time_buyer, home_mover, additional_property]}
      responses:
        '200': {description: Estimated transaction costs; all figures are estimates}
  /api/v1/real-estate/properties/favorites:
    get:
      operationId: real.estate.properties.favorites
      security: [{sanctum: []}]
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: sort_by, in: query, schema: {type: string, enum: [created_at, updated_at, price, year_built, bedrooms, bathrooms, area_sqft, address]}}
        - {name: sort_direction, in: query, schema: {type: string, enum: [asc, desc]}}
      responses: {'200': {description: Paginated saved properties}}
  /api/v1/real-estate/properties/favorites/{id}:
    delete:
      operationId: real.estate.properties.favoriteRemove
      security: [{sanctum: []}]
      responses: {'200': {description: Favorite removed}}
  /api/v1/real-estate/properties/{id}:
    get:
      operationId: real.estate.properties.get
      security: [{sanctum: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Authorized property, content: {application/json: {schema: {$ref: '#/components/schemas/PropertyResponse'}}}}
    patch: {operationId: real.estate.properties.update, responses: {'200': {description: Updated property}}}
    delete: {operationId: real.estate.properties.delete, responses: {'204': {description: Archived property}}}
  /api/v1/real-estate/properties/{id}/transition/{status}:
    post: {operationId: real.estate.properties.transition, responses: {'200': {description: Transitioned property}}}
  /api/v1/real-estate/properties/{id}/units:
    put: {operationId: real.estate.properties.units.upsert, responses: {'200': {description: Upserted property unit}}}
  /api/v1/real-estate/properties/{id}/keys:
    post: {operationId: real.estate.properties.keys.create, responses: {'201': {description: Recorded property key}}}
  /api/v1/real-estate/properties/{property}/ar-tour/config:
    get:
      operationId: real.estate.properties.ar-tour.config
      responses: {'200': {description: Public AR tour configuration}, '404': {description: AR tour unavailable}}
  /api/v1/real-estate/properties/{property}/walkability:
    post:
      operationId: real.estate.properties.walkability
      security: [{sanctum: []}]
      parameters: [{name: property, in: path, required: true, schema: {type: integer, minimum: 1}}]
      responses:
        '200': {description: 'Property updated with walkability, transit, and bike scores'}
        '404': {description: Property not found for the current team}
        '422': {description: Property has no coordinates}
  /api/v1/real-estate/properties/{property}/qr-code:
    get:
      operationId: real.estate.properties.qrCode
      security: [{sanctum: []}]
      parameters:
        - {name: property, in: path, required: true, schema: {type: integer, minimum: 1}}
        - {name: size, in: query, schema: {type: integer, minimum: 50, maximum: 1000, default: 200}}
      responses:
        '200': {description: Property QR-code URL and encoded property URL}
        '404': {description: Property not found for the current team}
        '422': {description: Invalid QR-code size}
  /api/v1/real-estate/properties/{property}/share:
    post:
      operationId: real.estate.properties.share
      security: [{sanctum: []}]
      parameters: [{name: property, in: path, required: true, schema: {type: integer, minimum: 1}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_email, recipient_name, sender_name, sender_email]
              properties:
                recipient_email: {type: string, format: email}
                recipient_name: {type: string, maxLength: 120}
                sender_name: {type: string, maxLength: 120}
                sender_email: {type: string, format: email}
                personal_message: {type: string, nullable: true, maxLength: 2000}
      responses:
        '200': {description: Property email sent}
        '404': {description: Property not found for the current team}
        '422': {description: Invalid share details}
  /api/v1/real-estate/properties/{property}/ar-tour/availability:
    get:
      operationId: real.estate.properties.ar-tour.availability
      responses: {'200': {description: AR tour availability and statistics}}
  /api/v1/real-estate/properties/{property}/ar-tour/enable:
    post:
      operationId: real.estate.properties.ar-tour.enable
      security: [{sanctum: []}]
      responses: {'200': {description: AR tour enabled}}
  /api/v1/real-estate/properties/{property}/ar-tour/disable:
    post:
      operationId: real.estate.properties.ar-tour.disable
      security: [{sanctum: []}]
      responses: {'200': {description: AR tour disabled}}
  /api/v1/real-estate/properties/{property}/ar-tour/settings:
    patch:
      operationId: real.estate.properties.ar-tour.settings
      security: [{sanctum: []}]
      responses: {'200': {description: AR tour settings updated}}
components:
  securitySchemes:
    sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}
  schemas:
    Error: {type: object, required: [message], properties: {message: {type: string}, code: {type: string}, errors: {type: object, additionalProperties: true}}}
    PaginationMeta: {type: object, required: [current_page, per_page, total, last_page], properties: {current_page: {type: integer}, per_page: {type: integer}, total: {type: integer}, last_page: {type: integer}}}
    LegacyPropertyMetadata: {type: object, properties: {created_by: {type: integer}, energy_rating_date: {type: string, format: date, nullable: true}, walkability_description: {type: string, nullable: true}, transit_description: {type: string, nullable: true}, bike_description: {type: string, nullable: true}, walkability_updated_at: {type: string, format: date-time, nullable: true}, live_tour_available: {type: boolean}, ar_tour_enabled: {type: boolean}, ar_tour_settings: {type: object, nullable: true}, ar_placement_guide: {type: string, nullable: true}, ar_model_scale: {type: number, nullable: true}, holographic_metadata: {type: object, nullable: true}, rightmove_id: {type: string, nullable: true}, zoopla_id: {type: string, nullable: true}, onthemarket_id: {type: string, nullable: true}, jupix_id: {type: string, nullable: true}, internal_notes: {type: string, nullable: true}, council_tax_band: {type: string, nullable: true}}}
    Property: {type: object, properties: {id: {type: integer}, team_id: {type: integer}, branch_id: {type: integer, nullable: true}, address: {type: string}, title: {type: string, nullable: true}, description: {type: string, nullable: true}, status: {type: string}, property_type: {type: string}, price: {type: number, nullable: true}, currency: {type: string, nullable: true}, bedrooms: {type: integer, nullable: true}, bathrooms: {type: integer, nullable: true}, reception_rooms: {type: integer, nullable: true}, area_sqft: {type: number, nullable: true}, year_built: {type: integer, nullable: true}, structured_address: {type: object, nullable: true}, parking: {type: object, nullable: true}, gardens: {type: object, nullable: true}, postal_code: {type: string, nullable: true}, country: {type: string, nullable: true}, tenure: {type: string, nullable: true}, lease_years_remaining: {type: integer, nullable: true}, service_charge: {type: number, nullable: true}, ground_rent: {type: number, nullable: true}, energy_rating: {type: string, nullable: true}, energy_score: {type: integer, nullable: true}, epc: {type: object, nullable: true}, walkability_score: {type: integer, nullable: true}, transit_score: {type: integer, nullable: true}, bike_score: {type: integer, nullable: true}, features: {type: array, items: {}}, characteristics: {type: object, nullable: true}, utilities: {type: object, nullable: true}, is_featured: {type: boolean}, virtual_tour_url: {type: string, nullable: true}, virtual_tour_provider: {type: string, nullable: true}, model_3d_url: {type: string, nullable: true}, holographic_tour_url: {type: string, nullable: true}, holographic_provider: {type: string, nullable: true}, holographic_enabled: {type: boolean}, floor_plan_data: {type: object, nullable: true}, floor_plan_image: {type: string, nullable: true}, latitude: {type: number, nullable: true}, longitude: {type: number, nullable: true}, list_date: {type: string, format: date, nullable: true}, sold_date: {type: string, format: date, nullable: true}, published_at: {type: string, format: date-time, nullable: true}, last_synced_at: {type: string, format: date-time, nullable: true}, description_generated_at: {type: string, format: date-time, nullable: true}, insurance_policy_id: {type: integer, nullable: true}, insurance_coverage_amount: {type: number, nullable: true}, insurance_premium: {type: number, nullable: true}, insurance_expiry_date: {type: string, format: date, nullable: true}, is_hmo: {type: boolean}, has_active_insurance: {type: boolean}, days_listed: {type: integer, minimum: 0, nullable: true}, price_per_square_foot: {type: number, minimum: 0, nullable: true}, price_per_square_meter: {type: number, minimum: 0, nullable: true}, price_usd: {type: number, nullable: true}, region_id: {type: integer, nullable: true}, city_id: {type: integer, nullable: true}, district_id: {type: integer, nullable: true}, agent_id: {type: integer, nullable: true}, disclosure_facts: {type: object, additionalProperties: true}, gallery: {type: array, items: {type: object, properties: {url: {type: string, format: uri}, kind: {type: string, enum: [photograph, floor plan, site plan]}, caption: {type: string, nullable: true}, staged: {type: boolean}}}}, is_favorited: {type: boolean}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}}
    PropertyResponse: {type: object, properties: {data: {$ref: '#/components/schemas/Property'}}}
    PropertyWithLegacyMetadata: {allOf: [{$ref: '#/components/schemas/Property'}, {$ref: '#/components/schemas/LegacyPropertyMetadata'}]}
    PropertyPage: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/PropertyWithLegacyMetadata'}}, meta: {$ref: '#/components/schemas/PaginationMeta'}}}
    PriceAlertInput: {type: object, required: [alert_percentage, alert_frequency], properties: {alert_percentage: {type: number, minimum: 0.1, maximum: 100}, alert_frequency: {type: string, enum: [daily, weekly, monthly]}, is_active: {type: boolean}}}
