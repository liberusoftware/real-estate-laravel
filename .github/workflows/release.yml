name: Release

on:
  push:
    # v-prefixed, which is what this repository has always tagged (v2.0.0 through
    # v4.4.0) and what CI.md specifies — "a protected version tag such as v1.2.3".
    # The pattern was unprefixed, so it matched none of them and this workflow had
    # never run once. The packages are the other convention: their tags are bare,
    # because Composer resolves them as versions.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit dependencies
        # Laravel Lang still requires the abandoned Dragon Code helpers.
        # Report abandonment while failing on every security advisory.
        run: composer audit --locked --abandoned=report

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      # A release is a claim that this tree is the one the fleet resolves to. Both halves
      # of that claim are checked here rather than assumed from a green Tests run on main:
      # the packages must match their published releases, and the suite must pass against
      # exactly those files.
      - name: Installed packages match the tracked source
        run: git diff --exit-code --stat -- modules themes

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests with release coverage gate
        run: composer test:coverage

      - name: Generate expanded module and theme coverage
        run: composer test:coverage:expanded

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit

      - name: Build frontend assets
        run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TAG"
          else
            gh release create "$TAG" --generate-notes --verify-tag
          fi
